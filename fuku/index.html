    <!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天気予報アプリ</title>
</head>

<body>
<main class="container">
  <h1>🌤️ 天気予報</h1>
  <p class="subtitle">世界の天気をリアルタイムにチェック</p>

  <form id="searchForm" class="search">
    <input
      id="cityInput"
      type="text"
      placeholder="都市名を入力（例：東京、大阪）"
      value="熊本"
      required
    >
    <button id="searchButton" type="submit">検索</button>
  </form>

  <p id="status" class="status" role="status">
    天気情報を取得しています...
  </p>

  <section id="weather" class="hidden">
    <div class="card">
      <div class="location" id="location"></div>
      <div class="updated" id="updated"></div>

      <div class="current">
        <div class="icon" id="currentIcon">🌤️</div>
        <div class="temperature" id="temperature">--°</div>
        <div class="description" id="description">--</div>
      </div>

      <div class="details">
        <div class="detail">
          <div class="detail-label">体感温度</div>
          <div class="detail-value" id="feelsLike">--°</div>
        </div>
        <div class="detail">
          <div class="detail-label">湿度</div>
          <div class="detail-value" id="humidity">--%</div>
        </div>
        <div class="detail">
          <div class="detail-label">風速</div>
          <div class="detail-value" id="wind">-- km/h</div>
        </div>
        <div class="detail">
          <div class="detail-label">降水量</div>
          <div class="detail-value" id="rain">-- mm</div>
        </div>
        <div class="detail">
          <div class="detail-label">降水確率</div>
          <div class="detail-value" id="rainChance">--%</div>
        </div>
        <div class="detail">
          <div class="detail-label">雲量</div>
          <div class="detail-value" id="cloud">--%</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📅 7日間の天気予報</h2>
      <div id="forecast" class="forecast"></div>
    </div>
  </section>

  <footer>
    Weather data by
    <a href="https://open-meteo.com/" target="_blank"
       rel="noopener noreferrer">Open-Meteo</a>
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);

const weatherTypes = {
  0: ["快晴", "☀️"],
  1: ["晴れ", "🌤️"],
  2: ["一部曇り", "⛅"],
  3: ["曇り", "☁️"],
  45: ["霧", "🌫️"],
  48: ["着氷性の霧", "🌫️"],
  51: ["弱い霧雨", "🌦️"],
  53: ["霧雨", "🌦️"],
  55: ["強い霧雨", "🌧️"],
  56: ["弱い着氷性の霧雨", "🌧️"],
  57: ["強い着氷性の霧雨", "🌧️"],
  61: ["弱い雨", "🌦️"],
  63: ["雨", "🌧️"],
  65: ["強い雨", "🌧️"],
  66: ["弱い着氷性の雨", "🌧️"],
  67: ["強い着氷性の雨", "🌧️"],
  71: ["弱い雪", "🌨️"],
  73: ["雪", "❄️"],
  75: ["大雪", "🌨️"],
  77: ["細かい雪", "❄️"],
  80: ["弱いにわか雨", "🌦️"],
  81: ["にわか雨", "🌧️"],
  82: ["激しいにわか雨", "⛈️"],
  85: ["弱いにわか雪", "🌨️"],
  86: ["強いにわか雪", "❄️"],
  95: ["雷雨", "⛈️"],
  96: ["雹を伴う雷雨", "⛈️"],
  99: ["激しい雹を伴う雷雨", "⛈️"]
};

function weatherInfo(code) {
  return weatherTypes[code] || ["不明", "🌡️"];
}

function setText(id, value) {
  $(id).textContent = value;
}

async function getWeather(city) {
  $("searchButton").disabled = true;
  $("status").textContent = "天気情報を取得しています...";
  $("weather").classList.add("hidden");

  try {
    // 都市名から緯度・経度を取得
    const geoURL =
      "https://geocoding-api.open-meteo.com/v1/search?" +
      new URLSearchParams({
        name: city,
        count: "10",
        language: "ja",
        format: "json"
      });

    const geoResponse = await fetch(geoURL);
    if (!geoResponse.ok) throw new Error("都市検索に失敗しました");

    const geoData = await geoResponse.json();
    if (!geoData.results || geoData.results.length === 0) {
      throw new Error("都市が見つかりません。別の名前で検索してください。");
    }

    // 日本国内の候補があれば優先
    const places = geoData.results;
    const place = places.find(p => p.country_code === "JP") || places[0];

    // 天気情報を取得
    const params = new URLSearchParams({
      latitude: place.latitude,
      longitude: place.longitude,
      current: [
        "temperature_2m",
        "relative_humidity_2m",
        "apparent_temperature",
        "is_day",
        "precipitation",
        "weather_code",
        "cloud_cover",
        "wind_speed_10m"
      ].join(","),
      hourly: "precipitation_probability",
      daily: [
        "weather_code",
        "temperature_2m_max",
        "temperature_2m_min",
        "precipitation_probability_max"
      ].join(","),
      timezone: "auto",
      forecast_days: "7"
    });

    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?" + params
    );

    if (!response.ok) throw new Error("天気データの取得に失敗しました");

    const data = await response.json();
    const current = data.current;
    const daily = data.daily;
    const info = weatherInfo(current.weather_code);

    // 現在の天気
    const area = [
      place.name,
      place.admin1,
      place.country
    ].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);

    setText("location", "📍 " + area.join("・"));
    setText(
      "updated",
      "観測・予報時刻：" +
      current.time.replace("T", " ") +
      "（現地時間）"
    );
    setText("currentIcon", info[1]);
    setText("temperature", Math.round(current.temperature_2m) + "°C");
    setText("description", info[0]);
    setText("feelsLike", Math.round(current.apparent_temperature) + "°C");
    setText("humidity", current.relative_humidity_2m + "%");
    setText("wind", current.wind_speed_10m + " km/h");
    setText("rain", current.precipitation + " mm");
    setText("cloud", current.cloud_cover + "%");

    // 現地時刻に対応する時間別の降水確率を取得
    const hourIndex = data.hourly.time.findIndex(
      time => time === current.time
    );
    const probability = hourIndex >= 0
      ? data.hourly.precipitation_probability[hourIndex]
      : null;

    setText(
      "rainChance",
      probability == null ? "--%" : probability + "%"
    );

    // 7日間の予報
    $("forecast").replaceChildren();

    daily.time.forEach((date, i) => {
      const dayInfo = weatherInfo(daily.weather_code[i]);
      const dateObj = new Date(date + "T12:00:00");
      const dateLabel = dateObj.toLocaleDateString("ja-JP", {
        month: "numeric",
        day: "numeric",
        weekday: "short"
      });

      const card = document.createElement("div");
      card.className = "day";

      const dateEl = document.createElement("div");
      dateEl.className = "day-date";
      dateEl.textContent = i === 0 ? "今日" : dateLabel;

      const iconEl = document.createElement("div");
      iconEl.className = "day-icon";
      iconEl.textContent = dayInfo[1];

      const descEl = document.createElement("div");
      descEl.className = "day-date";
      descEl.textContent = dayInfo[0];

      const tempEl = document.createElement("div");
      tempEl.className = "day-temp";
      tempEl.textContent =
        Math.round(daily.temperature_2m_max[i]) + "° / " +
        Math.round(daily.temperature_2m_min[i]) + "°";

      const rainEl = document.createElement("div");
      rainEl.className = "day-rain";
      const chance = daily.precipitation_probability_max[i];
      rainEl.textContent =
        "☔ " + (chance == null ? "--" : chance) + "%";

      card.append(dateEl, iconEl, descEl, tempEl, rainEl);
      $("forecast").appendChild(card);
    });

    $("weather").classList.remove("hidden");
    $("status").textContent = "";

  } catch (error) {
    $("status").textContent = "⚠️ " + error.message;
  } finally {
    $("searchButton").disabled = false;
  }
}

$("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  const city = $("cityInput").value.trim();

  if (city) getWeather(city);
});

// 最初は熊本の天気を表示
getWeather("熊本");
</script>
</body>
</html>
