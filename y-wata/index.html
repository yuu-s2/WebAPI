

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>為替を調べてください</title>

<!-- グラフ表示用ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: sans-serif;
    background-color: #f2f5fa;
    margin: 0;
    padding: 20px;
    color: #263238;
}

h1 {
    text-align: center;
    color: #207e17;
}

h2 {
    color: #174a7e;
    border-bottom: 2px solid #d6e3f0;
    padding-bottom: 8px;
    text-align: center;
}

section {
    background-color: rgb(255, 255, 255);
    max-width: 850px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #00000012;
}

select, input, button {
    padding: 9px;
    margin: 5px 3px;
    font-size: 15px;
    max-width: 100%;
}

button {
    background-color: #0d9704;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #0d4778;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border: 1px solid #d5dce5;
    padding: 10px;
    text-align: center;
}

th {
    background-color: #5da9f5;
}

.result {
    font-size: 18px;
    font-weight: bold;
    margin-top: 15px;
    overflow-wrap: anywhere;
}

.status {
    color: #555;
    font-size: 14px;
}

.chart-container {
    position: relative;
    width: 100%;
    min-height: 250px;
}
</style>
</head>

<body>

<h1>世界の為替レート</h1>

<!-- 機能1：為替レート一覧 -->
<section>
    <h2>為替レート一覧</h2>

    <p>基準を選んでください。</p>

    <select id="rateBase"></select>
    <button onclick="loadRates()">表示！</button>

    <p id="rateStatus" class="status"></p>

    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>通貨</th>
                    <th>為替レート</th>
                </tr>
            </thead>
            <tbody id="rateTable"></tbody>
        </table>
    </div>

    <p class="status">
        ※ 1単位の基準通貨が、相手通貨でいくらになるかを表示します。
    </p>
</section>

<!-- 機能2：通貨換算 -->
<section>
    <h2>通貨換算</h2>

    <p>換算したい金額と通貨を選択してください。</p>

    <input type="number" id="amount" value="1000" min="0"
           step="any" placeholder="金額">

    <br>

    <select id="fromCurrency"></select>
    <span>から</span>
    <select id="toCurrency"></select>

    <br>

    <button onclick="convertCurrency()">換算する</button>

    <p id="conversionResult" class="result"></p>
    <p id="conversionStatus" class="status"></p>
</section>

<!-- 機能3：過去の為替レートグラフ -->
<section>
    <h2>為替レートの変化のグラフ</h2>

    <p>通貨を選んでください。</p>

    <label for="chartBase">基準通貨：</label>
    <select id="chartBase"></select>

    <br>

    <label for="chartQuote">相手通貨：</label>
    <select id="chartQuote"></select>

    <br>

    <label for="period">期間：</label>
<select id="period">
    <option value="30">過去30日</option>
    <option value="90">過去90日</option>
    <option value="180">過去180日</option>
    <option value="365">過去1年</option>
    <option value="1825">過去5年</option>
    <option value="3650">過去10年</option>
    <option value="10950">過去30年</option>
</select>

    <button onclick="loadChart()">グラフを表示</button>

    <p id="chartStatus" class="status"></p>

    <div class="chart-container">
        <canvas id="rateChart"></canvas>
    </div>
</section>

<p style="text-align:center;" class="status">
    為替データ：Frankfurter API
</p>

<script>
const API = "https://api.frankfurter.dev/v2";

// 対応する15種類の通貨
const currencies = [
    { code: "JPY", name: "日本円" },
    { code: "USD", name: "米ドル" },
    { code: "EUR", name: "ユーロ" },
    { code: "GBP", name: "イギリスポンド" },
    { code: "KRW", name: "韓国ウォン" },
    { code: "CNY", name: "中国元" },
    { code: "CAD", name: "カナダドル" },
    { code: "AUD", name: "オーストラリアドル" },
    { code: "CHF", name: "スイスフラン" },
    { code: "NZD", name: "ニュージーランドドル" },
    { code: "SGD", name: "シンガポールドル" },
    { code: "HKD", name: "香港ドル" },
    { code: "THB", name: "タイバーツ" },
    { code: "INR", name: "インドルピー" },
    { code: "MXN", name: "メキシコペソ" },
    { code: "VND", name: "ベトナムドン" },
];

// 通貨選択欄を作る
function setupCurrencySelects() {
    const selectIds = [
        "rateBase",
        "fromCurrency",
        "toCurrency",
        "chartBase",
        "chartQuote"
    ];

    selectIds.forEach(id => {
        const select = document.getElementById(id);

        currencies.forEach(currency => {
            const option = document.createElement("option");
            option.value = currency.code;
            option.textContent =
                currency.name + " (" + currency.code + ")";
            select.appendChild(option);
        });
    });

    // 初期設定
    document.getElementById("rateBase").value = "JPY";
    document.getElementById("fromCurrency").value = "JPY";
    document.getElementById("toCurrency").value = "USD";
    document.getElementById("chartBase").value = "USD";
    document.getElementById("chartQuote").value = "JPY";
}

// APIからデータを取得する共通処理
async function fetchJSON(url) {
    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("データを取得できませんでした　すまない　許さん");
    }

    return await response.json();
}

// 機能1：為替レート一覧を表示する
async function loadRates() {
    const base = document.getElementById("rateBase").value;
    const table = document.getElementById("rateTable");
    const status = document.getElementById("rateStatus");

    table.innerHTML = "";
    status.textContent = "レートを取得しています...";

    try {
        const quotes = currencies
            .map(currency => currency.code)
            .filter(code => code !== base)
            .join(",");

        const url =
            `${API}/rates?base=${base}&quotes=${quotes}`;

        const data = await fetchJSON(url);

        data.sort((a, b) =>
            a.quote.localeCompare(b.quote)
        );

        data.forEach(item => {
            const row = document.createElement("tr");

            const currencyCell = document.createElement("td");
            currencyCell.textContent = getCurrencyName(item.quote);

            const rateCell = document.createElement("td");
            rateCell.textContent =
                Number(item.rate).toLocaleString("ja-JP", {
                    maximumFractionDigits: 6
                });

            row.appendChild(currencyCell);
            row.appendChild(rateCell);
            table.appendChild(row);
        });

        if (data.length > 0) {
            status.textContent =
                "基準通貨：" + base +
                " ／ データの日付：" + data[0].date;
        } else {
            status.textContent = "レートが見つかりませんでした。";
        }

    } catch (error) {
        status.textContent =
            "レートを取得できませんでした。時間をおいて再試行してください。";
    }
}

// 通貨コードから通貨名を取得する
function getCurrencyName(code) {
    const currency = currencies.find(item => item.code === code);

    if (currency) {
        return currency.name + " (" + code + ")";
    }

    return code;
}

// 機能2：通貨を換算する
async function convertCurrency() {
    const amount =
        Number(document.getElementById("amount").value);

    const from =
        document.getElementById("fromCurrency").value;

    const to =
        document.getElementById("toCurrency").value;

    const result =
        document.getElementById("conversionResult");

    const status =
        document.getElementById("conversionStatus");

    result.textContent = "";
    status.textContent = "";

    if (!Number.isFinite(amount) || amount < 0) {
        status.textContent = "0以上の金額を入力してください。";
        return;
    }

    status.textContent = "換算しています...";

    try {
        const url = `${API}/rate/${from}/${to}`;
        const data = await fetchJSON(url);

        const converted = amount * data.rate;

        result.textContent =
            amount.toLocaleString("ja-JP") + " " + from +
            " = " +
            converted.toLocaleString("ja-JP", {
                maximumFractionDigits: 4
            }) + " " + to;

        status.textContent =
            "使用したレート：" + data.rate +
            " ／ データの日付：" + data.date;

    } catch (error) {
        status.textContent =
            "換算できませんでした。別の通貨を選んでください。";
    }
}

// グラフを保存しておく変数
let rateChart = null;

// 日付をYYYY-MM-DD形式にする
function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

// 機能3：過去の為替レートをグラフにする
async function loadChart() {
    const base = document.getElementById("chartBase").value;
    const quote = document.getElementById("chartQuote").value;
    const period = Number(document.getElementById("period").value);

    const status = document.getElementById("chartStatus");

    if (base === quote) {
        status.textContent =
            "基準通貨と相手通貨には、異なる通貨を選んでください。";
        return;
    }

    status.textContent = "過去のレートを取得しています...";

    try {
        const endDate = new Date();
        const startDate = new Date();

        startDate.setDate(startDate.getDate() - period);

        const fromDate = formatDate(startDate);
        const toDate = formatDate(endDate);

        const url =
            `${API}/rates?base=${base}` +
            `&quotes=${quote}` +
            `&from=${fromDate}&to=${toDate}`;

        const data = await fetchJSON(url);

        const filteredData = data
            .filter(item => item.quote === quote)
            .sort((a, b) => a.date.localeCompare(b.date));

        if (filteredData.length === 0) {
            status.textContent =
                "この期間のデータが見つかりませんでした。";
            return;
        }

        const labels = filteredData.map(item => item.date);
        const values = filteredData.map(item => item.rate);

        const ctx = document.getElementById("rateChart");

        if (rateChart) {
            rateChart.destroy();
        }

        rateChart = new Chart(ctx, {
            type: "line",

            data: {
                labels: labels,

                datasets: [{
                    label: `${base}から${quote}への為替レート`,
                    data: values,
                    borderColor: "#1769aa",
                    backgroundColor: "#1769aa22",
                    borderWidth: 2,
                    pointRadius: 1,
                    fill: true,
                    tension: 0.2
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                scales: {
                    x: {
                        title: {
                            display: true,
                            text: "日付"
                        }
                    },

                    y: {
                        title: {
                            display: true,
                            text: `1 ${base} あたりの ${quote}`
                        }
                    }
                }
            }
        });

        status.textContent =
            "表示期間：" + fromDate + " ～ " + toDate +
            " ／ データ件数：" + filteredData.length;

    } catch (error) {
        status.textContent =
            "グラフを表示できませんでした。別の通貨や期間を試してください。";
    }
}

// ページを開いたときに実行する
setupCurrencySelects();
loadRates();
loadChart();
</script>

</body>
</html>
